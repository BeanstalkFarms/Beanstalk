query MarketEvents($events_first: Int = 1000, $events_id_gt: ID!) {
  marketEvents: marketplaceEvents(
    orderBy: id
    orderDirection: asc
    first: $events_first
    where: { id_gt: $events_id_gt }
  ) {
    id
    hash
    createdAt
    # --------
    # LISTINGS
    # --------
    ... on PodListingCancelled {
      id
      index # of the Listing that was cancelled
      account
      historyID
      placeInLine
      # => amount
      # => pricePerPod
    }
    ... on PodListingCreated {
      id
      index
      amount
      maxHarvestableIndex
      pricePerPod
      historyID
      placeInLine
    }
    ... on PodListingFilled {
      id
      fromFarmer
      toFarmer
      amount
      index # of Listing that sold
      placeInLine
      start
      historyID
      # => pricePerPod
    }
    # ------
    # ORDERS
    # ------
    ... on PodOrderCancelled {
      id
      orderId
      account
      historyID
      # => amount
      # => maxPlaceInLine
      # => pricePerPod
    }
    ... on PodOrderCreated {
      id
      amount
      maxPlaceInLine
      pricePerPod
      historyID
    }
    ... on PodOrderFilled {
      id
      fromFarmer
      toFarmer
      historyID
      amount
      placeInLine
      index # index of plot was sold to the Order
      start #
      # => maxPlaceInLine
      # => pricePerPod
    }
  }
}
